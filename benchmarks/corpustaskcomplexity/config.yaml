config_paths:
  - resources_servers/corpustaskcomplexity/configs/corpustaskcomplexity.yaml
  - responses_api_models/vllm_model/configs/vllm_model.yaml

# Override these with Gym CLI args to prepare additional published rungs.
ctc_data_dir: benchmarks/corpustaskcomplexity/data/shared
ctc_rungs: [r2k, r4k, r8k, r16k, r32k]
ctc_data_revision: 04ab86006124b3f34c566f44bbc82d4fec98fcda
prepare_script_args:
  output_dir: ${ctc_data_dir}
  rungs: ${ctc_rungs}
  revision: ${ctc_data_revision}

# Match the recommended CTC harness's plain-text completion prompt exactly.
policy_model:
  responses_api_models:
    vllm_model:
      use_completions_api: true
      render_chat_template: false
      uses_reasoning_parser: false
      uses_interleaved_reasoning: false

corpustaskcomplexity_benchmark_simple_agent:
  _inherit_from: corpustaskcomplexity_simple_agent
  responses_api_agents:
    simple_agent:
      datasets:
        - name: corpustaskcomplexity
          type: benchmark
          jsonl_fpath: ${ctc_data_dir}/corpustaskcomplexity_benchmark.jsonl
          prompt_config: null
          prepare_script: benchmarks/corpustaskcomplexity/prepare.py
          num_repeats: 1

corpustaskcomplexity_benchmark_environment_server:
  _inherit_from: corpustaskcomplexity_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: corpustaskcomplexity_benchmark_simple_agent
