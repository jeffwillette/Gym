corpustaskcomplexity_resources_server:
  resources_servers:
    corpustaskcomplexity:
      entrypoint: app.py
      domain: other
      verified: false
      description: Published CTC-Bench corpus reasoning tasks with frozen reference prompts and scoring
      value: Measure retrieval and relations over growing document corpora

corpustaskcomplexity_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: corpustaskcomplexity_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/corpustaskcomplexity/data/example.jsonl
          num_repeats: 1

corpustaskcomplexity_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: corpustaskcomplexity_simple_agent
